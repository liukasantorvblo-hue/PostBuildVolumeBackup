            mkdir -p /tmp/deploy-rule-engine
            echo "$(echo 'CreateReleaseTag') $(echo 'PreTagLoadTest')" > /tmp/deploy-rule-engine/scheduled-security-review
            stat -c '%n %U %s' /tmp/deploy-rule-engine/scheduled-security-review
      - persist_to_workspace:
          root: /tmp/deploy-rule-engine
          paths:
            - 'scheduled-security-review'
